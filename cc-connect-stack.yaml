AWSTemplateFormatVersion: '2010-09-09'
Description: cc-connect on EC2 with Bedrock API key, accessed via SSM Session Manager (no inbound ports).

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

# IMPORTANT: Before deploying this stack, create the Bedrock API key SSM parameter
# yourself in Parameter Store (CloudFormation cannot create SecureString
# parameters). Do not put the credential in this template or shell history.
#
# The instance role below grants read access to that parameter by ARN.

Parameters:
  InstanceType:
    Type: String
    Default: m8i.2xlarge
    Description: EC2 instance type (m8i.* is x86_64, same arch as t3 — no AMI change needed)
  CcConnectVersion:
    Type: String
    Default: 1.5.0
    Description: Official cc-connect npm release; keep aligned with versions.json
  ClaudeCodeVersion:
    Type: String
    Default: 2.1.285
    Description: '@anthropic-ai/claude-code npm version; verified 2026-09-30'
  CodexVersion:
    Type: String
    Default: 0.159.2
    Description: '@openai/codex npm version to pin for the codex agent'
  VolumeSizeGiB:
    Type: Number
    Default: 50
    Description: Root EBS volume size in GiB
  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: AWS region used by Claude Code to call Bedrock
  # Robot models belong to the active providers in ~/.cc-connect/config.toml.
  # Codex has an isolated home and its own endpoint/credential configuration.
  # This template bootstraps the host; it does not provision bot app credentials.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into (use the default VPC)
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in the chosen VPC

Resources:

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadBedrockApiKeyParam
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cc-connect/bedrock-api-key

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  InstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: cc-connect host - no inbound, all outbound
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound (Bedrock, Feishu WS, GitHub, npm)
      # SecurityGroupIngress intentionally omitted = no inbound rules

  Instance:
    Type: AWS::EC2::Instance
    # Personal Feishu agents, maintained through SSM. Use official npm releases.
    # UserData runs only on first boot; existing hosts need a separate SSM update.
    # Keep credentials out of bootstrap logs and preserve project/session data.
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !Ref InstanceSG
      SubnetId: !Ref SubnetId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSizeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: cc-connect
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          umask 022
          exec > >(tee -a /var/log/cc-connect-userdata.log) 2>&1

          # 1. Use the verified Node.js 22 runtime.
          curl -fsSL https://rpm.nodesource.com/setup_22.x | bash -
          dnf install -y nodejs git jq python3.12

          # 2. Install Claude Code, Codex, and cc-connect globally.
          #    Pin the versions verified together; update versions.json too.
          npm install -g @anthropic-ai/claude-code@${ClaudeCodeVersion}
          npm install -g @openai/codex@${CodexVersion}
          npm install -g cc-connect@${CcConnectVersion}

          # 3. Pull Bedrock API key from SSM and write env file
          API_KEY="$(aws ssm get-parameter \
            --name /cc-connect/bedrock-api-key \
            --with-decryption \
            --region ${AWS::Region} \
            --query Parameter.Value --output text)"

          # Interactive access reads the same credential file without duplicating it.
          cat >/etc/profile.d/cc-connect.sh <<'EOF'
          if [ -r /etc/cc-connect.env ]; then
              . /etc/cc-connect.env
              export AWS_REGION AWS_BEARER_TOKEN_BEDROCK
              export CLAUDE_CODE_USE_BEDROCK=1
              unset CC_CODEX_BEDROCK_API_KEY
          fi
          EOF
          chown root:ec2-user /etc/profile.d/cc-connect.sh
          chmod 640 /etc/profile.d/cc-connect.sh

          # Restrict permissions before writing credentials. The independent
          # Codex Mantle credential is added when provisioning that agent.
          install -m 640 -o root -g ec2-user /dev/null /etc/cc-connect.env
          cat >/etc/cc-connect.env <<EOF
          AWS_REGION=${BedrockRegion}
          AWS_BEARER_TOKEN_BEDROCK=$API_KEY
          EOF
          unset API_KEY

          # One service definition. Enable it only after provisioning bot config.
          sudo -u ec2-user mkdir -p /home/ec2-user/.config/systemd/user
          cat >/home/ec2-user/.config/systemd/user/cc-connect.service <<'EOF'
          [Unit]
          Description=cc-connect official ${CcConnectVersion}
          After=network-online.target
          StartLimitIntervalSec=300
          StartLimitBurst=10

          [Service]
          Type=simple
          ExecStart=/usr/bin/cc-connect --config /home/ec2-user/.cc-connect/config.toml
          WorkingDirectory=/home/ec2-user/.cc-connect
          EnvironmentFile=/etc/cc-connect.env
          Environment="PATH=/home/ec2-user/.local/bin:/usr/local/bin:/usr/bin:/bin"
          Environment="CODEX_HOME=/home/ec2-user/.cc-connect/agents/codex"
          Environment="CC_LOG_FILE=/home/ec2-user/.cc-connect/logs/cc-connect.log"
          Environment="CC_LOG_MAX_SIZE=10M"
          Restart=always
          RestartSec=5
          KillMode=control-group
          TimeoutStopSec=45

          [Install]
          WantedBy=default.target
          EOF
          chown -R ec2-user:ec2-user /home/ec2-user/.config

          # 4. Prep ec2-user workspace dirs
          sudo -u ec2-user mkdir -p /home/ec2-user/.cc-connect
          sudo -u ec2-user mkdir -p /home/ec2-user/workspaces

          # 5. Enable systemd user lingering so cc-connect daemon stays up
          #    even when no interactive ec2-user session is logged in.
          loginctl enable-linger ec2-user

          echo "cc-connect host bootstrap complete; provision bot configuration before starting service"

Outputs:
  InstanceId:
    Description: EC2 instance ID (use this with SSM Session Manager)
    Value: !Ref Instance
  ConnectCommand:
    Description: Command to open a Session Manager shell from your laptop
    Value: !Sub aws ssm start-session --target ${Instance} --region ${AWS::Region}
  ParamName:
    Description: SSM parameter that holds the Bedrock API key (must be created out-of-band as SecureString)
    Value: /cc-connect/bedrock-api-key
